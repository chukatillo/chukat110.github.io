<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Медитации</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            height: 100vh;
            background: 
            linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
            url('IMG.jpg') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px 40px;
            border-radius: 20px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
	        0 25px 40px rgba(0, 0, 0, 0.3),
	        inset 0 1px 0 rgba(255, 255, 255, 0.1);
	    transform: perspective(1000px) rotateX(5deg) translateZ(50px);
	    transition: transform 0.5s ease; 
        }
	
	.container:hover {
	    transform: perspective(1000px) rotateX(0deg) translateZ(80px);
	}
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
	    font-weight: 400;
    	    letter-spacing: -0.02em;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: white;
            color: #333;
            transform: translateY(-3px);
        }

        nav {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        nav a:hover {
            text-shadow: 0 0 15px white;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Главная</a>
        <a href="#">Каталог</a>
        <a href="#">О нас</a>
        <a href="#">Контакты</a>
    </nav>

    <div class="container">
        <h1>Название</h1>
        <button class="btn">Перейти в каталог</button>
    </div>
</body>
</html>
